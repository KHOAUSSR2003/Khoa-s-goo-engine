name: Build Goo Engine
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v3

      - name: Giải phóng dung lượng ổ đĩa
        run: |
          # Xóa các thành phần không cần thiết trên server GitHub để lấy 20GB trống
          rm -rf "C:/Program Files/dotnet"
          rm -rf "C:/Android"

      - name: Tải thư viện bổ trợ (SVN)
        run: ./make.bat update

      - name: Biên dịch Release
        run: ./make.bat release

      - name: Upload sản phẩm
        uses: actions/upload-artifact@v3
        with:
          name: Goo-Engine-Final
          path: ../build_windows_Full_x64_vc17_Release/bin/Release/
